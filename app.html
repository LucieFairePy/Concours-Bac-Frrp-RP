<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Concours BAC — France Roleplay</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dossier.css">
  <link rel="stylesheet" href="css/cover.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body class="booting">
  <header>
    <img class="logo" src="assets/logo-bac.svg" width="56" height="63"
         alt="Écusson Brigade Anti-Criminalité">
    <div>
      <h1>CONCOURS D’INTÉGRATION — BRIGADE ANTI-CRIMINALITÉ</h1>
      <div class="mut">
        Police Nationale • France Roleplay • outil fictif d’évaluation
        <span id="who"></span>
        <span id="sync" class="sync"></span>
      </div>
    </div>
    <nav class="no-print">
      <button onclick="app.view('home')">Dossier</button>
      <button onclick="app.view('hist')">Historique</button>
      <button onclick="app.view('settings')">Paramètres</button>
      <button onclick="app.saveNow()">Enregistrer</button>
      <button class="primary" onclick="app.newDossier()">Nouveau</button>
    </nav>
  </header>

  <main>
    <div id="banner" class="no-print"></div>

    <section id="home" class="view">
      <div class="hero">
        <div class="flag"></div>
        <h2 id="hero">Nouveau concours</h2>
        <div class="mut">Passage candidat → Correction → Résultats → Fiche finale • /1000</div>
      </div>
      <div id="tabs" class="tabs no-print"></div>
      <div class="no-print">
        <div class="progress"><span id="prog"></span></div>
        <div id="stepText" class="steptext"></div>
      </div>
      <div id="sections"></div>
    </section>

    <section id="hist" class="view" style="display:none">
      <div class="card">
        <h2>Historique des dossiers clôturés</h2>
        <div id="histList"></div>
      </div>
    </section>

    <section id="settings" class="view" style="display:none">
      <div id="settingsBox"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
