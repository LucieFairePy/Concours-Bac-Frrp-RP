<body class="booting">
  <!-- Accès examinateur : seul écran visible tant qu'aucune session n'est ouverte. -->
  <main class="gate-wrap">
    <section class="gate-card">
      <header class="gate-head">
        <img class="gate-logo" src="assets/bac75n/01_LOGO_BAC75N_PRINCIPAL.png" width="84" height="84"
             onerror="this.onerror=null;this.src='assets/logo-bac.svg'"
             alt="Écusson Brigade Anti-Criminalité">
        <div>
          <h1>PORTAIL BAC 75 N</h1>
          <h2>Brigade Anti-Criminalité</h2>
          <div class="flag"></div>
          <p class="mut">Police Nationale • France Roleplay • accès examinateur</p>
        </div>
      </header>

      <div id="gate"></div>
    </section>

    <p class="gate-foot mut">
      Document fictif — France Roleplay — sans valeur administrative réelle.
    </p>
  </main>

  <!-- Portail : coque commune, puis la page de la route en cours dans #view. -->
  <aside id="portalSidebar" class="psidebar no-print"></aside>
  <header id="portalHeader" class="phead"></header>
  <div id="moduleBar"></div>
  <main id="view"></main>

  <script type="module" src="js/main.js"></script>
</body>
